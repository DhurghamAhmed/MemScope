name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Hash the artifact
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/memscope.exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item target/release/memscope.exe).Length
          "$hash  memscope.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Write-Host "sha256 $hash ($size bytes)"
          "SHA256=$hash" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "SIZE=$size" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV

      - name: Attest the build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/release/memscope.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/memscope.exe
            SHA256SUMS.txt
          body: |
            Windows x64. No runtime required — the MSVC CRT is linked statically
            and only Windows system DLLs are imported.

            `memscope.exe` — ${{ env.SIZE }} bytes
            sha256 `${{ env.SHA256 }}`

            Install and verify in one command:

            ```powershell
            irm https://raw.githubusercontent.com/DhurghamAhmed/MemScope/main/install.ps1 | iex
            ```

            The binary is unsigned. Its build provenance is attested by GitHub,
            so you can verify where it was built:

            ```powershell
            gh attestation verify memscope.exe --repo DhurghamAhmed/MemScope
            ```
          generate_release_notes: true
